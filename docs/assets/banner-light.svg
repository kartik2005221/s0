<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="brand-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <radialGradient id="glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-light)" rx="12" />
  <rect width="1200" height="320" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12" />

  <!-- Ambient Glow -->
  <circle cx="220" cy="160" r="240" fill="url(#glow-light)" />

  <!-- Technical Grid Pattern -->
  <g stroke="#E2E8F0" stroke-width="0.5" stroke-opacity="0.8">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Graphic Icon Symbol -->
  <g transform="translate(100, 85)">
    <!-- Shield / Hexagon Shape -->
    <path d="M 75 0 L 150 42 L 150 108 L 75 150 L 0 108 L 0 42 Z" fill="#FFFFFF" stroke="url(#brand-grad-light)" stroke-width="4" />
    <!-- Concentric Target Circles (Sector Zero) -->
    <circle cx="75" cy="75" r="45" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="75" cy="75" r="25" fill="none" stroke="#C2410C" stroke-width="3" />
    <!-- Center Core Dot -->
    <circle cx="75" cy="75" r="8" fill="#C2410C" />
  </g>

  <!-- Title & Branding -->
  <text x="290" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Rubik, Roboto, sans-serif" font-size="44" font-weight="800" fill="#0B192C" letter-spacing="-0.03em">
    s0 <tspan fill="#C2410C">—</tspan> Sector Zero
  </text>

  <!-- Subtitle -->
  <text x="290" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Rubik, Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
    Unified Forensic Media Sanitization, Acquisition &amp; Evidence Carving
  </text>

  <!-- Standards & Architecture Badges -->
  <g transform="translate(290, 205)">
    <!-- Badge 1: NIST SP 800-88 -->
    <rect x="0" y="0" width="165" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="16" cy="17" r="4" fill="#059669" />
    <text x="28" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0F172A">NIST SP 800-88 R2</text>

    <!-- Badge 2: RFC 8032 Ed25519 -->
    <rect x="177" y="0" width="155" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="193" cy="17" r="4" fill="#C2410C" />
    <text x="205" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0F172A">RFC 8032 Ed25519</text>

    <!-- Badge 3: RFC 8785 Canonical JSON -->
    <rect x="344" y="0" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="360" cy="17" r="4" fill="#0284C7" />
    <text x="372" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0F172A">RFC 8785 Canonical</text>

    <!-- Badge 4: Linux, macOS, Windows -->
    <rect x="536" y="0" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="552" cy="17" r="4" fill="#7C3AED" />
    <text x="564" y="22" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#0F172A">Linux · macOS · Windows</text>
  </g>
</svg>
