site_name: s0 — Sector Zero
site_description: >-
  Forensic-grade drive sanitization, file recovery, and cryptographic audit suite.
  NIST SP 800-88 compliant. Ed25519 signed certificates. Zero-trust verification.
site_author: Kartik & s0 Contributors
site_url: https://s0-docs-ten.vercel.app/
repo_url: https://github.com/kartik2005221/s0
repo_name: kartik2005221/s0
copyright: >-
  Made by <a href="https://github.com/kartik2005221" target="_blank" rel="noopener">@kartik2005221</a>

docs_dir: docs
site_dir: public

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    # Slate / Dark Mode (Default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Fira Sans
    code: Fira Code
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartik2005221/s0
      name: s0 on GitHub
  status:
    new: Recently added
    deprecated: Deprecated

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang: en

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Frequently Asked Questions (FAQ): faq.md
  - Core Modules & Guides:
      - Comprehensive User Manual: USER_MANUAL.md
      - Secure Erasure Guide: secure-erasure-guide.md
      - Bare-Metal Live ISO (Offline Station): LIVE_ISO_BUILD_GUIDE.md
      - Forensic File Carver: forensic-carving-guide.md
      - Web Dashboard: web-dashboard.md
      - CLI Reference: cli-reference.md
      - Verification & Air-Gapped Trust: VERIFICATION_AND_DEPLOYMENT.md
  - Architecture & Engineering:
      - System Architecture: ARCHITECTURE.md
      - Security Model: security-model.md
      - Certificate & Schema Spec: certificate-format.md
      - Canonical JSON v1 Contract: CANONICAL_JSON.md
      - Performance Benchmarks: PERFORMANCE.md
  - Compliance & Standards:
      - NIST SP 800-88 Compliance: COMPLIANCE.md
      - Technical Limitations & Scope: LIMITATIONS.md
      - Platform Validation:
          - Linux Storage & Emulation: platforms/linux.md
          - macOS Native APFS: platforms/macos.md
          - Windows Native Storage: platforms/windows.md
  - Developer & Defense:
      - Evaluator Handover: HANDOVER.md
      - Pitch & Defense Outline: PITCH_OUTLINE.md
      - Forensic Test Plan & QA: TEST_PLAN.md
      - Agentic AI & High-Risk Safety: agentic-ai.md
      - Contributing Guide: contributing.md
      - Changelog & Releases: changelog.md
  - Verification Portal ↗: https://s0-vp.vercel.app/
