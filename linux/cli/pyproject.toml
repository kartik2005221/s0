[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s0-cli"
version = "2.4.2"
description = "S0 (Sector Zero) — Unified Forensic Sanitization & Recovery CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["s0-core"]

[project.scripts]
s0 = "s0_cli.main:main"

[tool.setuptools.packages.find]
include = ["s0_cli*"]
