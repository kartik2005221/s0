[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustwipe-cli"
version = "0.1.0"
description = "TrustWipe Linux secure-wipe CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["trustwipe-core"]

[project.scripts]
trustwipe-wipe = "trustwipe_cli.main:main"

[tool.setuptools.packages.find]
include = ["trustwipe_cli*"]
