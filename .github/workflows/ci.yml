name: CI

# Runs on every branch, not just master.
#
# The original trigger was `master` only, which meant that all of the work on
# `agent/harness` had never been through CI at all. A gate that does not run is
# not a gate, so the trigger is every push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A superseded run is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep pip from writing a cache directory that outlives the job, and make
  # deprecation warnings visible rather than lost in a log nobody reads.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared by pyproject; 3.13 is new enough to catch
        # use of a deprecated API before users do.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # macOS is exercised only on the floor and the ceiling: the suite is
          # long, and a platform-specific failure is what this is here to find.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,dev]"

      # /tmp is small on some runners, and a full suite writes a lot to it. A
      # quota error mid-run looks like a test failure and is not one.
      - name: Free scratch space
        run: df -h /tmp || true

      - name: Pytest
        run: pytest -q --tb=short
        env:
          # Deterministic hashing so a failure reproduces.
          PYTHONHASHSEED: "0"

      - name: Verify the wheel installs and runs standalone
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          # A wheel that cannot carve is a wheel that does not work, and the
          # package-data lookup this exercises is the thing that silently
          # depended on a source tree.
          /tmp/wheeltest/bin/s0 --version
          /tmp/wheeltest/bin/s0 carve --help > /dev/null
          echo "wheel ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Ruff is a hard wall over the whole tree.
      #
      # This used to be a ratchet (hard gate on changed files, whole tree reported
      # as advisory) because the repo carried ~1,286 findings, mostly `List` ->
      # `list` modernisation. That backlog is cleared now, so the ratchet is dead
      # weight: it let a tree-wide regression through whenever the offending file
      # happened to be untouched by the commit. A gate nobody trusts is worse than
      # no gate, because people learn to read red as normal.
      #
      # The intentional exceptions are not scattered `# noqa` comments. They are
      # `per-file-ignores` in pyproject.toml, each with a comment saying why:
      # best-effort cleanup (S110), deferred imports (E402), and the platform
      # erasers and release script shelling out to tools found on PATH (S603,
      # S607). Anything else is a real finding and should fail the build.
      - name: Ruff (lint, whole tree, blocking)
        run: ruff check --output-format=github .
      # pre-commit already enforced ruff-format on every commit, so 139 files were
      # one `pre-commit run` away from being rewritten -- and CI, which is what
      # actually gates a merge, never checked. A formatter enforced only in a hook
      # nobody runs is not a standard; it is a suggestion. The tree is now formatted
      # (verified by AST comparison: zero semantic changes across 69 files) and this
      # step keeps it that way.
      - name: Ruff (format, blocking)
        run: ruff format --check --diff .

      - name: EditorConfig and hygiene
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        continue-on-error: true
        with:
          # Advisory for the same reason: whole-tree hygiene hooks fire on files
          # this change did not touch, and blocking on them blocks everything.
          extra_args: --all-files

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install mypy
      # Advisory, not a gate. Turning mypy into a hard failure on a codebase
      # this size would mean hundreds of annotations written to satisfy a
      # checker rather than to say something, and the finding count would then
      # be a number people learn to ignore.
      # Advisory, not a gate -- but no longer silent.
      #
      # Two of the defects fixed on this branch were found by mypy and then
      # ignored because the job could not fail: a `return` of the wrong arity that
      # crashed the carver once a recovery budget was reached, and an attribute
      # typo (`method_id` for `id`) that raised on every SSD/NVMe/ATA plan. Both
      # were `[return-value]` and `[attr-defined]`. A checker that finds real bugs
      # and is then forbidden from reporting them as failures is decoration.
      #
      # So: still non-blocking, but the report is published and summarised by error
      # code, which makes "did the count of the classes that matter go up?"
      # answerable from the CI log. Those two codes are the ones worth ratcheting to
      # blocking first -- deliberately not done blind here, because doing so
      # without being able to run mypy locally risks turning the gate red on an
      # unknown number of pre-existing findings.
      - name: Mypy
        run: |
          mypy src/s0 --ignore-missing-imports --no-error-summary             | tee mypy-report.txt || true
          echo "--- errors by code ---"
          grep -oE '\[[a-z-]+\]' mypy-report.txt | sort | uniq -c | sort -rn || true


      # The two classes that have actually caught defects on this branch, now
      # blocking. Both found real bugs that were then ignored:
      #
      #   [return-value]  tiff_end returned `end`, which mypy saw as a str -- and
      #                    it was: `end` was the TIFF byte-order character for the
      #                    first 120 lines and the absolute end offset for the last.
      #                    It worked only because the int was assigned last. Any use
      #                    of the byte order after that point would hand an int to
      #                    struct.unpack_from.
      #   [attr-defined]  `s0 plan --json` read `alt.method.method_id`; WipeMethod
      #                    publishes `id`. Image targets leave method=None so the
      #                    conditional short-circuited and the typo survived, firing
      #                    on every SSD/NVMe/ATA target.
      #
      # The rest stays advisory. Turning all ~125 into failures would mean writing
      # annotations to satisfy a checker rather than to say something, and the count
      # would become a number people learn to ignore.
      - name: Mypy gate (attr-defined, return-value)
        run: |
          mypy src/s0 --ignore-missing-imports --no-error-summary \
            --enable-error-code=attr-defined \
            --enable-error-code=return-value \
            --disable-error-code=assignment \
            --disable-error-code=arg-type \
            --disable-error-code=misc \
            --disable-error-code=union-attr \
            --disable-error-code=operator \
            --disable-error-code=list-item \
            --disable-error-code=index \
            --disable-error-code=no-redef \
            --disable-error-code=truthy-function \
            --disable-error-code=var-annotated \
            --disable-error-code=call-overload \
            --disable-error-code=dict-item \
            --disable-error-code=typeddict-item

      - name: Publish mypy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mypy-report
          path: mypy-report.txt
          retention-days: 30

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Bandit
        run: bandit -r src/s0 -c pyproject.toml --severity-level medium
      # A tool that shells out to ffmpeg and hdparm, and signs certificates,
      # has a dependency surface worth watching on every run rather than
      # after an advisory.
      - name: pip-audit
        run: |
          pip-audit --progress-spinner off --strict || \
            pip-audit --progress-spinner off || \
            echo "pip-audit reported advisories; see the job log"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Initialize
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3
        with:
          category: "/language:python"

  workflow-lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Was `docker://rhysd/actionlint:latest` -- a mutable ref, and the only one
      # left in these workflows. Every action is now pinned to a commit SHA with the
      # version recorded in a trailing comment, because a tag is mutable: whoever
      # controls the repository can move `v4` to new code, and this workflow runs on
      # every push. Each SHA below was resolved from the GitHub API and verified to
      # be a real commit before being written down, not guessed from a tag name.
      - name: actionlint
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106  # v1.7.7
        with:
          args: -color
      # Was `ludeeus/action-shellcheck@master` -- a third-party action tracking a
      # moving branch, which means a maintainer of that repository (or anyone who
      # takes it over) could change the code this workflow executes. Removed rather
      # than pinned: shellcheck is pre-installed on GitHub-hosted runners, so the
      # action was buying nothing but a supply-chain dependency. `apt-get install`
      # covers the case where a future runner image drops it, and the explicit
      # `--version` makes an unexpectedly absent or ancient shellcheck visible
      # instead of silently skipping the scan.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          # -x follows `source`, which the installers use for their helper library.
          find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './build/*' \
            -print0 | xargs -0 --no-run-if-empty shellcheck -x -S warning
      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: iso/**/Dockerfile

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip cyclonedx-bom
          pip install -e . --quiet
          # A tool that is handed a device needs its dependency list to be
          # auditable without running it.
          cyclonedx-py environment --output-format JSON --outfile s0-sbom.json
          cyclonedx-py requirements --output-format JSON --outfile s0-requirements-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: s0-*-sbom.json
          retention-days: 90
