name: CI

# Runs on every branch, not just master.
#
# The original trigger was `master` only, which meant that all of the work on
# `agent/harness` had never been through CI at all. A gate that does not run is
# not a gate, so the trigger is every push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A superseded run is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep pip from writing a cache directory that outlives the job, and make
  # deprecation warnings visible rather than lost in a log nobody reads.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared by pyproject; 3.13 is new enough to catch
        # use of a deprecated API before users do.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # macOS is exercised only on the floor and the ceiling: the suite is
          # long, and a platform-specific failure is what this is here to find.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,dev]"

      # /tmp is small on some runners, and a full suite writes a lot to it. A
      # quota error mid-run looks like a test failure and is not one.
      - name: Free scratch space
        run: df -h /tmp || true

      - name: Pytest
        run: pytest -q --tb=short
        env:
          # Deterministic hashing so a failure reproduces.
          PYTHONHASHSEED: "0"

      - name: Verify the wheel installs and runs standalone
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          # A wheel that cannot carve is a wheel that does not work, and the
          # package-data lookup this exercises is the thing that silently
          # depended on a source tree.
          /tmp/wheeltest/bin/s0 --version
          /tmp/wheeltest/bin/s0 carve --help > /dev/null
          echo "wheel ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Ruff is a hard wall over the whole tree.
      #
      # This used to be a ratchet (hard gate on changed files, whole tree reported
      # as advisory) because the repo carried ~1,286 findings, mostly `List` ->
      # `list` modernisation. That backlog is cleared now, so the ratchet is dead
      # weight: it let a tree-wide regression through whenever the offending file
      # happened to be untouched by the commit. A gate nobody trusts is worse than
      # no gate, because people learn to read red as normal.
      #
      # The intentional exceptions are not scattered `# noqa` comments. They are
      # `per-file-ignores` in pyproject.toml, each with a comment saying why:
      # best-effort cleanup (S110), deferred imports (E402), and the platform
      # erasers and release script shelling out to tools found on PATH (S603,
      # S607). Anything else is a real finding and should fail the build.
      - name: Ruff (lint, whole tree, blocking)
        run: ruff check --output-format=github .

      - name: EditorConfig and hygiene
        uses: pre-commit/action@v3.0.1
        continue-on-error: true
        with:
          # Advisory for the same reason: whole-tree hygiene hooks fire on files
          # this change did not touch, and blocking on them blocks everything.
          extra_args: --all-files

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install mypy
      # Advisory, not a gate. Turning mypy into a hard failure on a codebase
      # this size would mean hundreds of annotations written to satisfy a
      # checker rather than to say something, and the finding count would then
      # be a number people learn to ignore.
      - name: Mypy
        run: mypy src/s0 --ignore-missing-imports --no-error-summary || true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Bandit
        run: bandit -r src/s0 -c pyproject.toml --severity-level medium
      # A tool that shells out to ffmpeg and hdparm, and signs certificates,
      # has a dependency surface worth watching on every run rather than
      # after an advisory.
      - name: pip-audit
        run: |
          pip-audit --progress-spinner off --strict || \
            pip-audit --progress-spinner off || \
            echo "pip-audit reported advisories; see the job log"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  workflow-lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        args: -color
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: iso/**/Dockerfile

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip cyclonedx-bom
          pip install -e . --quiet
          # A tool that is handed a device needs its dependency list to be
          # auditable without running it.
          cyclonedx-py environment --output-format JSON --outfile s0-sbom.json
          cyclonedx-py requirements --output-format JSON --outfile s0-requirements-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: s0-*-sbom.json
          retention-days: 90
