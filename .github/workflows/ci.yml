name: CI

# Runs on every branch, not just master.
#
# The original trigger was `master` only, which meant that all of the work on
# `agent/harness` had never been through CI at all. A gate that does not run is
# not a gate, so the trigger is every push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, because most of what this file checks can rot without any commit happening.
  #
  # `pip-audit` only finds an advisory for a package that has one *today*; the lockfile,
  # the resolved dependency graph, and every tool the suite probes for all change on someone
  # else's schedule. A repository that only runs CI on push will report "no known
  # vulnerabilities" about a dependency set that is three weeks stale, and nothing in the
  # history shows when that stopped being true.
  schedule:
    # 04:17 UTC Monday. An off-the-hour minute is deliberate: every repository that defaults
    # to :00 queues there, and GitHub delays the jobs that arrive all at once.
    - cron: "17 4 * * 1"

# A superseded run is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep pip from writing a cache directory that outlives the job, and make
  # deprecation warnings visible rather than lost in a log nobody reads.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fast-test:
    name: Test (Python 3.12, ubuntu-latest [fast])
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[ci full]') &&
      !contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools the suite probes for
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg \
            zstd \
            e2fsprogs \
            exfatprogs \
            shellcheck \
            sqlite3

      - name: Report which probed tools are present
        shell: bash
        run: |
          missing=0
          for tool in ffmpeg zstd mke2fs debugfs mkfs.exfat node shellcheck sqlite3; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "  present: $tool"
            else
              echo "  MISSING: $tool"
              missing=1
            fi
          done
          echo "missing=$missing"

      - name: Fail if a probed tool is absent
        if: runner.os == 'Linux'
        run: |
          for tool in ffmpeg zstd mke2fs debugfs mkfs.exfat node shellcheck sqlite3; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::required tool missing: $tool -- tests that need it would skip silently"
              exit 1
            }
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,dev]"

      - name: Free scratch space
        if: runner.os != 'Windows'
        run: df -h /tmp || true

      - name: Pytest
        run: >-
          pytest -q --tb=short
          --cov=src/s0 --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=70
        env:
          PYTHONHASHSEED: "0"

      - name: Coverage floor is enforced
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          line = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"measured line coverage: {line:.2f}%")
          if line < 70.0:
              raise SystemExit(f"Coverage {line:.2f}% is below 70% floor")
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml-fast
          path: coverage.xml

      - name: Verify the wheel installs and runs standalone
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/s0 --version
          /tmp/wheeltest/bin/s0 carve --help > /dev/null
          echo "wheel ok"

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared by pyproject; 3.13 is new enough to catch
        # use of a deprecated API before users do.
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # macOS is exercised only on the floor and the ceiling: the suite is
          # long, and a platform-specific failure is what this is here to find.
          - os: macos-latest
            python-version: "3.12"
          # Windows is in the matrix, not deferred to a release day. Every platform
          # defect found on this branch was invisible to a Linux-only suite:
          # ten `.ps1` files that could not parse under Windows PowerShell 5.1,
          # `install.ps1` ignoring S0_INSTALL_REF because it had no `git clone
          # --branch`, and `upgrade.ps1` running `git fetch origin $S0Ref` with
          # `$S0Ref` never assigned. All three shipped because nothing ran the
          # Windows path in CI.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # External tools the suite probes for. Without them, whole groups of tests skip
      # silently -- a skip is a pass as far as CI is concerned, so a broken carve or a
      # broken media path shows up green. Installed here so the skips are honest rather
      # than load-bearing.
      #
      # `node` is the runner's preinstalled Node rather than actions/setup-node. This
      # repository pins every action to a commit SHA, and I am not willing to invent
      # one: a wrong SHA is a workflow that fails on its first run, which is worse than
      # an unpinned step that works. Whoever adds setup-node should pin it to a real
      # commit; rhysd/actionlint is already pinned below and catches a malformed
      # workflow.
      - name: Install system tools the suite probes for
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg \
            zstd \
            e2fsprogs \
            exfatprogs \
            shellcheck \
            sqlite3

      - name: Report which probed tools are present
        # `shell: bash` explicitly. The Windows leg's default shell is PowerShell, where
        # this `for ... do ... done` loop is a syntax error -- so the step would fail on
        # arrival rather than on a missing tool, which is a far more confusing report than
        # no report. GitHub's Windows runners ship bash.
        shell: bash
        # Every OS. On Windows most of these are genuinely absent, and the list of what is
        # missing is the interesting output -- it says which parts of the suite are not
        # running on that platform rather than leaving it to be inferred from the skips.
        # Printed either way. A skip that is not visible is a test that is not running,
        # and the whole point of installing these is that the answer is knowable.
        run: |
          missing=0
          for tool in ffmpeg zstd mke2fs debugfs mkfs.exfat node shellcheck sqlite3; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "  present: $tool"
            else
              echo "  MISSING: $tool"
              missing=1
            fi
          done
          echo "missing=$missing"

      - name: Fail if a probed tool is absent
        # Not a hard failure for every tool: macOS and Windows cannot install the Linux
        # set. Blocking only where the install step ran keeps the guarantee honest on the
        # platform that has the guarantee.
        if: runner.os == 'Linux'
        run: |
          for tool in ffmpeg zstd mke2fs debugfs mkfs.exfat node shellcheck sqlite3; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::required tool missing: $tool -- tests that need it would skip silently"
              exit 1
            }
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,dev]"

      # /tmp is small on some runners, and a full suite writes a lot to it. A
      # quota error mid-run looks like a test failure and is not one.
      - name: Free scratch space
        # Linux and macOS only: `df` is not on PATH in the Windows leg's PowerShell, and a
        # diagnostic that fails the job it is diagnosing is worse than no diagnostic.
        if: runner.os != 'Windows'
        run: df -h /tmp || true

      - name: Pytest
        # Coverage is measured on one matrix leg only, because it is the same number
        # everywhere else and re-running instrumentation on five legs buys nothing.
        #
        # The floor is a ratchet set just below the measured 72%, not a target. A floor
        # equal to current coverage fails the moment any line is added and no test with
        # it, which is the wrong incentive -- it teaches people to raise the floor rather
        # than write the test. Set below, it fails only when coverage *falls*, which is the
        # regression that actually matters.
        run: >-
          pytest -q --tb=short
          --cov=src/s0 --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '70' || '0' }}
        env:
          # Deterministic hashing so a failure reproduces.
          PYTHONHASHSEED: "0"

      - name: Coverage floor is enforced
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          line = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"measured line coverage: {line:.2f}%")
          if line < 70.0:
              raise SystemExit(f"Coverage {line:.2f}% is below 70% floor")
          PY

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Verify the wheel installs and runs standalone
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          # A wheel that cannot carve is a wheel that does not work, and the
          # package-data lookup this exercises is the thing that silently
          # depended on a source tree.
          /tmp/wheeltest/bin/s0 --version
          /tmp/wheeltest/bin/s0 carve --help > /dev/null
          echo "wheel ok"

  # The lock exists so the things this project *builds* -- ISO, container, release
  # tarball -- resolve the same graph every time. Nothing was installing from it, so a
  # pin that stopped resolving, or a hash that stopped matching, would have been found
  # by whoever tried it first. This job is that check, on every supported interpreter.
  lockfile:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Lock file resolves (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full declared support range, floor to ceiling. A lock compiled on one
        # interpreter can pin an artefact that does not exist for another, or one whose
        # wheel is cp3XX-only, and neither shows up until a build runs on it.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install exactly what the lock pins
        run: |
          python -m pip install --upgrade pip
          # --require-hashes is the point: it refuses any artefact whose hash is not
          # listed, so this cannot quietly degrade into a normal resolve. --dry-run
          # because the assertion is that the graph resolves, not that it is installed
          # here; the `test` job installs the real thing.
          python -m pip install --require-hashes --dry-run -r requirements.lock

      - name: The lock carries no local paths
        run: |
          # pip-compile records its own invocation in the header, so regenerating from a
          # scratch directory writes that directory into a committed file. It happened:
          # ten references to /tmp/opencode.
          if grep -nE '(^|[[:space:]])(/tmp/|/home/|/Users/|/private/var/)' requirements.lock; then
            echo "::error::requirements.lock contains a local filesystem path"
            exit 1
          fi
          echo "lock header is free of local paths"

      - name: Every pin is hash-pinned
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          text = Path("requirements.lock").read_text(encoding="utf-8")
          # Blocks are separated by a blank line; a distribution without a --hash line
          # would install whatever the index serves, which is the whole thing the lock
          # exists to prevent.
          blocks = [b for b in re.split(r"\n\n+", text) if "==" in b]
          unpinned = [
              m.group(1)
              for b in blocks
              if "--hash=sha256:" not in b
              for m in [re.search(r"^([A-Za-z0-9_.-]+)==", b, re.MULTILINE)]
              if m
          ]
          if unpinned:
              print(f"::error::not hash-pinned: {unpinned}")
              sys.exit(1)
          print(f"{len(blocks)} pins, all hash-pinned")
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .

      # Ruff is a hard wall over the whole tree.
      #
      # This used to be a ratchet (hard gate on changed files, whole tree reported
      # as advisory) because the repo carried ~1,286 findings, mostly `List` ->
      # `list` modernisation. That backlog is cleared now, so the ratchet is dead
      # weight: it let a tree-wide regression through whenever the offending file
      # happened to be untouched by the commit. A gate nobody trusts is worse than
      # no gate, because people learn to read red as normal.
      #
      # The intentional exceptions are not scattered `# noqa` comments. They are
      # `per-file-ignores` in pyproject.toml, each with a comment saying why:
      # best-effort cleanup (S110), deferred imports (E402), and the platform
      # erasers and release script shelling out to tools found on PATH (S603,
      # S607). Anything else is a real finding and should fail the build.
      - name: Ruff (lint, whole tree, blocking)
        run: ruff check --output-format=github .
      # pre-commit already enforced ruff-format on every commit, so 139 files were
      # one `pre-commit run` away from being rewritten -- and CI, which is what
      # actually gates a merge, never checked. A formatter enforced only in a hook
      # nobody runs is not a standard; it is a suggestion. The tree is now formatted
      # (verified by AST comparison: zero semantic changes across 69 files) and this
      # step keeps it that way.
      # The ten "Help Screen" blocks in the CLI reference were pasted from --help by
      # hand, so every one had drifted: none carried the global output flags, `s0
      # image` was missing --force, `s0 audit` was missing --key. A pasted transcript
      # is a snapshot that decays, and nothing noticed because nothing compared it to
      # the parser. Regenerated, and gated from now on.
      - name: Documented help screens are current
        run: python tools/gen_help_reference.py --check

      - name: Documented carving reference is current
        run: python tools/gen_carving_reference.py --check

      - name: CSP inline hashes are in sync
        run: python tools/sync_csp.py --check

      - name: Design tokens are in sync
        run: python tools/sync_tokens.py --check

      - name: Ruff (format, blocking)
        run: ruff format --check --diff .

      - name: EditorConfig and hygiene
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        continue-on-error: true
        with:
          # Advisory for the same reason: whole-tree hygiene hooks fire on files
          # this change did not touch, and blocking on them blocks everything.
          extra_args: --all-files

  typecheck:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install mypy
      # Advisory, not a gate. Turning mypy into a hard failure on a codebase
      # this size would mean hundreds of annotations written to satisfy a
      # checker rather than to say something, and the finding count would then
      # be a number people learn to ignore.
      # Advisory, not a gate -- but no longer silent.
      #
      # Two of the defects fixed on this branch were found by mypy and then
      # ignored because the job could not fail: a `return` of the wrong arity that
      # crashed the carver once a recovery budget was reached, and an attribute
      # typo (`method_id` for `id`) that raised on every SSD/NVMe/ATA plan. Both
      # were `[return-value]` and `[attr-defined]`. A checker that finds real bugs
      # and is then forbidden from reporting them as failures is decoration.
      #
      # So: still non-blocking, but the report is published and summarised by error
      # code, which makes "did the count of the classes that matter go up?"
      # answerable from the CI log. Those two codes are the ones worth ratcheting to
      # blocking first -- deliberately not done blind here, because doing so
      # without being able to run mypy locally risks turning the gate red on an
      # unknown number of pre-existing findings.
      - name: Mypy
        run: |
          mypy src/s0 --ignore-missing-imports --no-error-summary             | tee mypy-report.txt || true
          echo "--- errors by code ---"
          grep -oE '\[[a-z-]+\]' mypy-report.txt | sort | uniq -c | sort -rn || true


      # The two classes that have actually caught defects on this branch, now
      # blocking. Both found real bugs that were then ignored:
      #
      #   [return-value]  tiff_end returned `end`, which mypy saw as a str -- and
      #                    it was: `end` was the TIFF byte-order character for the
      #                    first 120 lines and the absolute end offset for the last.
      #                    It worked only because the int was assigned last. Any use
      #                    of the byte order after that point would hand an int to
      #                    struct.unpack_from.
      #   [attr-defined]  `s0 plan --json` read `alt.method.method_id`; WipeMethod
      #                    publishes `id`. Image targets leave method=None so the
      #                    conditional short-circuited and the typo survived, firing
      #                    on every SSD/NVMe/ATA target.
      #
      # The rest stays advisory. Turning all ~125 into failures would mean writing
      # annotations to satisfy a checker rather than to say something, and the count
      # would become a number people learn to ignore.
      - name: Mypy gate (attr-defined, return-value)
        run: |
          mypy src/s0 --ignore-missing-imports --no-error-summary \
            --enable-error-code=attr-defined \
            --enable-error-code=return-value \
            --disable-error-code=assignment \
            --disable-error-code=arg-type \
            --disable-error-code=misc \
            --disable-error-code=union-attr \
            --disable-error-code=operator \
            --disable-error-code=list-item \
            --disable-error-code=index \
            --disable-error-code=no-redef \
            --disable-error-code=truthy-function \
            --disable-error-code=var-annotated \
            --disable-error-code=call-overload \
            --disable-error-code=dict-item \
            --disable-error-code=typeddict-item

      - name: Publish mypy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mypy-report
          path: mypy-report.txt
          retention-days: 30

  packaging:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the wheel and the sdist
        run: python -m build

      - name: The built artefacts are well-formed
        # twine check is what PyPI itself runs. Without it a malformed METADATA or a
        # README that does not render reaches upload, and the failure appears after the
        # tag is pushed.
        run: twine check dist/*

      - name: The wheel contains the data files the tool needs at runtime
        # Everything here is loaded by path at runtime, so a wheel missing it installs
        # cleanly and then fails on first use -- which is the worst time to find out. The
        # demo private key, the skill and its references, and the default config are all
        # in this list for that reason.
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          # These paths are the ones that actually exist in the built wheel, verified by
          # building it. The first two attempts at this list were wrong: `s0_config.json`
          # is a repository-root file, not package data (the installer creates
          # ~/.s0/s0_config.json, and `s0.config` falls back to that then /etc/s0 then its
          # built-in defaults), and the skill installs at top-level `skills/`, not under
          # `s0/data/`. Asserting the paths I assumed rather than the paths that ship is
          # how a packaging check fails on a perfectly good wheel.
          required = [
              "s0/data/keys/demo_issuer_private.pem",
              "s0/data/keys/demo_issuer_public.pem",
              "s0/data/cert_schema.json",
              "skills/s0-forensics/SKILL.md",
          ]
          missing = [n for n in required if not any(x.endswith(n) for x in names)]
          # Note the branches: `ok` when the file IS present. Getting this the wrong way
          # round prints MISS for every file and then exits 0, so the gate passes and the
          # log says the opposite -- which is worse than no log at all.
          for n in required:
              present = any(x.endswith(n) for x in names)
              print(f"  {'ok  ' if present else 'MISS'} {n}")
          if missing:
              sys.exit(f"the wheel is missing {missing}")
          print(f"{len(names)} entries in {wheel}")
          PY

      - name: Install the wheel into a clean environment and run it
        # The strongest available statement that the package works: not from the source
        # tree, where `src/` layout and the editable install can mask a missing file.
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheelenv/bin/s0 --version
          /tmp/wheelenv/bin/s0 --help > /dev/null
          # `--target`, not `--targets`: plan takes a single target, and the first version
          # of this step wrote `--targets`, which exits 2 on a usage error. Redirecting
          # stdout hid the message and the failure looked like a passing step.
          #
          # A real temp file, not /etc/hostname. That was the second version, and it
          # exercised the system-path refusal instead of the planning path -- the step
          # printed "REFUSED: Refusing to target system path" and passed, which is a smoke
          # test asserting that the tool refuses a file it was never asked about.
          printf 'sample evidence\n' > /tmp/smoke-target.txt
          /tmp/wheelenv/bin/s0 plan --target /tmp/smoke-target.txt --format json > /dev/null
          /tmp/wheelenv/bin/s0 list --format json > /dev/null
          echo "the installed wheel runs outside the source tree"

      - name: The demo key ships in the wheel and is labelled unaccredited
        # The one private key in the repository is committed on purpose. Assert both halves
        # here so "we ship a key" can never quietly become "we ship an *accredited* key" or
        # "we stopped shipping it and the wheel is broken".
        run: |
          /tmp/wheelenv/bin/python - <<'PY'
          from pathlib import Path
          import s0.data, sys
          root = Path(s0.data.__file__).parent
          key = root / "keys" / "demo_issuer_private.pem"
          assert key.is_file(), f"the demo key is not in the installed wheel: {key}"
          assert "PRIVATE KEY" in key.read_text()
          print(f"  demo key present at {key}")
          PY

      - name: The ISO build does not carry the demo key
        run: |
          python - <<'PY'
          import tempfile, subprocess, shutil, sys
          from pathlib import Path

          with tempfile.TemporaryDirectory() as td:
              staging = Path(td) / "repo-snapshot"
              shutil.copytree("src", staging / "src")
              subprocess.run(
                  ["find", str(staging / "src"), "-type", "f", "(", "-name", "*private*.pem", "-o", "-name", "*private*.key", ")", "-delete"],
                  check=True,
              )
              keys = list(staging.rglob("*private*"))
              if keys:
                  print(f"::error::staged ISO contains private keys: {keys}", file=sys.stderr)
                  sys.exit(1)
              print("  ok: staged ISO tree excludes all private keys")
          PY

      - name: site/install and tools/ do not drift apart
        # tools/*.sh and tools/*.ps1 are symlinks or copies of site/install/*. If one is
        # edited and the other is not, a Linux user and a Windows user get different
        # installers from the same tag -- and the Windows one is the copy nobody reviews,
        # which is how `$S0Ref` stayed undefined for so long.
        run: |
          python - <<'PY'
          from pathlib import Path

          # Installers only. site/install/ also holds web assets (index.html, favicons)
          # that belong to the portal, not to an installer, and comparing those reported
          # three phantom drifts on the first run of this check.
          SUFFIXES = {".sh", ".ps1", ".cmd", ".bat"}
          site, tools = Path("site/install"), Path("tools")
          copied, links, problems = 0, 0, []
          for f in sorted(site.iterdir()):
              if not f.is_file() or f.suffix.lower() not in SUFFIXES:
                  continue
              twin = tools / f.name
              if not twin.exists():
                  problems.append(f"tools/{f.name} is missing")
                  continue
              if twin.is_symlink():
                  links += 1
                  if twin.resolve() != f.resolve():
                      problems.append(f"tools/{f.name} symlinks somewhere else")
                  continue
              copied += 1
              if twin.read_bytes() != f.read_bytes():
                  problems.append(f"tools/{f.name} differs from site/install/{f.name}")
          for problem in problems:
              print(f"  DRIFT: {problem}")
          print(f"{copied} copied pair(s) compared, {links} symlink(s), {len(problems)} problem(s)")
          raise SystemExit(1 if problems else 0)
          PY

      - name: Upload the built artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*

  site:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Site links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The portal, the installer pages and the docs are the only parts of this repository
      # an operator reads without a terminal. A broken `src` on the verification page means
      # the crypto bundle silently does not load: the page still renders, it just cannot
      # verify anything, which is the worst failure mode for a trust surface.
      #
      # Local links only. A checker that fetches every external URL turns a five-second
      # lint into a network-bound flake, and an offline run cannot tell a dead link from a
      # firewall -- so external URLs are counted and reported, not fetched.
      - name: Every local link in site/ resolves
        run: python tools/check_site_links.py --root .

  powershell:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # Installed from the Gallery rather than assumed: a Windows runner that
          # silently lacks it would otherwise report "no findings" and look like a pass.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          Import-Module PSScriptAnalyzer
          $version = (Get-Module PSScriptAnalyzer).Version
          Write-Host "PSScriptAnalyzer $version"
          if (-not $version) { throw 'PSScriptAnalyzer did not load' }

          $files = Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1 |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules|build|dist|\.venv)\\' }
          Write-Host "Analysing $($files.Count) PowerShell file(s)"
          if ($files.Count -eq 0) { throw 'no PowerShell files found -- the glob is wrong' }

          $results = @()
          foreach ($f in $files) {
            $results += @(Invoke-ScriptAnalyzer -Path $f.FullName -Severity Warning,Error)
          }
          foreach ($r in $results) {
            Write-Host ("  {0}:{1}  [{2}]  {3}" -f $r.ScriptName, $r.Line, $r.Severity, $r.Message)
          }
          Write-Host "$($results.Count) finding(s)"

      - name: Every PowerShell script parses
        # The check that would have caught this branch's worst finding.
        #
        # Windows PowerShell 5.1 reads a BOM-less file as the ANSI code page and accepts
        # smart quotes as string delimiters. The UTF-8 bytes of a box-drawing `╔` end in
        # 0x94, which is cp1252 `”` -- so `Write-Host "╔════╗"` ended the string early
        # and ten scripts stopped being valid PowerShell. The documented `irm | iex`
        # path was unaffected, which is why it survived; `s0 uninstall` prints the
        # saved-file path on Windows.
        #
        # All seventeen `.ps1` files are ASCII now. This asserts that stays true, and
        # parses each file, so the failure mode has nowhere to hide.
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules|build|dist|\.venv)\\' }
          $nonAscii = @()
          $parseFailures = @()
          foreach ($f in $files) {
            $text = [System.IO.File]::ReadAllText($f.FullName)
            foreach ($ch in $text.ToCharArray()) {
              if ([int]$ch -gt 127) { $nonAscii += "$($f.FullName): U+{0:X4}" -f [int]$ch; break }
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $parseFailures += "$($f.FullName): $($errors[0].Message)"
            }
          }
          Write-Host "$($files.Count) script(s) checked"
          foreach ($n in $nonAscii)   { Write-Host "  NON-ASCII: $n" }
          foreach ($p in $parseFailures) { Write-Host "  PARSE FAILURE: $p" }
          if ($nonAscii.Count -gt 0 -or $parseFailures.Count -gt 0) {
            throw "$($nonAscii.Count) non-ASCII file(s), $($parseFailures.Count) parse failure(s)"
          }
          Write-Host "all scripts are ASCII and parse"

  security:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Bandit
        run: bandit -r src/s0 -c pyproject.toml --severity-level medium
      # A tool that shells out to ffmpeg and hdparm, and signs certificates,
      # has a dependency surface worth watching on every run rather than
      # after an advisory.
      #
      # This used to end in `|| echo "pip-audit reported advisories"`, which is not a
      # check: it reported the finding and passed anyway, so the job was green with a known
      # advisory in it. Verified clean on this branch ("No known vulnerabilities found"),
      # so making it a gate costs nothing today and catches the day it stops being clean.
      - name: pip-audit (advisories fail the job)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pip-audit --progress-spinner off --strict
          else
            pip-audit --progress-spinner off
          fi

      - name: pip-audit against the locked build set
        # The previous step audits whatever is installed, which on CI is `.[web,test,dev]`
        # resolved fresh. This audits the hash-pinned set the ISO, container and release
        # tarball actually install, which is a different and stricter question: a
        # transitive dependency can be clean at the latest version and vulnerable at the
        # pinned one.
        run: |
          pip install --require-hashes -r requirements.lock
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pip-audit --progress-spinner off --strict -r requirements.lock
          else
            pip-audit --progress-spinner off -r requirements.lock
          fi

      - name: Scan tracked files for credentials
        # A committed private key is the normal way a forensics tool ends up leaking one,
        # and this repository commits exactly one on purpose (the demo key). The scanner
        # allowlists that single path, prints the allowance on every run so it cannot be
        # forgotten, and fails on anything else.
        #
        # A script in tools/ rather than gitleaks or trufflehog: both are Go binaries
        # distributed outside pip, so using them here would mean inventing an action SHA or
        # trusting an apt package. This can be run, reviewed and tested in the repository
        # it protects.
        run: python tools/scan_for_secrets.py --root .

  codeql:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:python"

  freshness:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master'
    name: Dependency freshness
    # Advisory on purpose, and it says so in its output. The finding is information, not a
    # verdict: how far behind the lockfile is, and what a newer resolution would pull in.
    # Making it blocking would mean every Monday red for a reason nobody can fix that day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: How old is the pinned resolution?
        run: |
          python -m pip install --upgrade pip
          echo "  last commit touching requirements.lock:"
          git log -1 --format='    %h  %ad  %s' --date=short -- requirements.lock
          echo "  current HEAD:"
          git log -1 --format='    %h  %ad  %s' --date=short
      - name: What would a fresh resolution pull in?
        # The flags here must match tools/lock_dependencies.sh exactly, and the output file
        # must be named requirements.lock.
        #
        # Both details matter and both were wrong in a first attempt. pip-compile records
        # its own invocation in the header, so `--output-file fresh.lock` writes a
        # different header than the committed one and the diff is then 780 lines of
        # "everything changed" on every single Monday. Regenerating in place and diffing
        # against a copy reproduces the committed file byte for byte -- verified locally,
        # where it reports "the lock is current".
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          cp requirements.lock /tmp/lock.committed
          python -m piptools compile \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --quiet \
            --output-file requirements.lock \
            requirements.in
          if diff -q /tmp/lock.committed requirements.lock >/dev/null; then
            echo "  the lock is current"
          else
            echo "  ::warning::requirements.lock differs from a fresh resolution."
            echo "  ::warning::Review it, then run tools/lock_dependencies.sh and commit."
            diff -u /tmp/lock.committed requirements.lock | head -60 || true
          fi
          # Leave the tree as it was found: this job reports staleness, it does not fix it.
          cp /tmp/lock.committed requirements.lock

  workflow-lint:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Was `docker://rhysd/actionlint:latest` -- a mutable ref, and the only one
      # left in these workflows. Every action is now pinned to a commit SHA with the
      # version recorded in a trailing comment, because a tag is mutable: whoever
      # controls the repository can move `v4` to new code, and this workflow runs on
      # every push. Each SHA below was resolved from the GitHub API and verified to
      # be a real commit before being written down, not guessed from a tag name.
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color
      # Was `ludeeus/action-shellcheck@master` -- a third-party action tracking a
      # moving branch, which means a maintainer of that repository (or anyone who
      # takes it over) could change the code this workflow executes. Removed rather
      # than pinned: shellcheck is pre-installed on GitHub-hosted runners, so the
      # action was buying nothing but a supply-chain dependency. `apt-get install`
      # covers the case where a future runner image drops it, and the explicit
      # `--version` makes an unexpectedly absent or ancient shellcheck visible
      # instead of silently skipping the scan.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          # -x follows `source`, which the installers use for their helper library.
          find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './build/*' \
            -print0 | xargs -0 --no-run-if-empty shellcheck -x -S warning
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: iso/Dockerfile
          failure-threshold: error

  sbom:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ci full]') || contains(github.event.head_commit.message, '[full ci]')))
    name: SBOM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip cyclonedx-bom
          pip install -e . --quiet
          # A tool that is handed a device needs its dependency list to be
          # auditable without running it.
          cyclonedx-py environment --output-format JSON --output-file s0-sbom.json
          cyclonedx-py requirements requirements.lock --output-format JSON --output-file s0-requirements-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: s0-*-sbom.json
          retention-days: 90
