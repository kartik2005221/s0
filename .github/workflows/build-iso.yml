name: Build Bootable Live ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach ISO to (e.g. v2.3.0)'
        required: false
        default: 'v2.3.0'

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Bare-Metal Live ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Live-Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            curl
          curl -sLO https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          echo "db5e5ae5925092066fee0e87e9e274af32c56f7b08db254377e248e95e07efae  live-build_20230502_all.deb" | sha256sum -c -
          sudo dpkg -i live-build_20230502_all.deb || sudo apt-get install -fy

      - name: Build s0 Live ISO
        run: |
          chmod +x linux/iso/build.sh linux/iso/auto/build.sh
          cd linux/iso
          sudo ./auto/build.sh
          sudo cp live-image-amd64.hybrid.iso "$GITHUB_WORKSPACE/s0-live-amd64.hybrid.iso"
          sudo chown runner:runner "$GITHUB_WORKSPACE/s0-live-amd64.hybrid.iso"

      - name: Prepare Artifacts & Checksums
        run: |
          test -f s0-live-amd64.hybrid.iso || { echo "Error: s0-live-amd64.hybrid.iso not found"; exit 1; }
          sha256sum s0-live-amd64.hybrid.iso > s0-live-amd64.hybrid.iso.sha256
          cat s0-live-amd64.hybrid.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s0-live-amd64.hybrid.iso
          path: |
            s0-live-amd64.hybrid.iso
            s0-live-amd64.hybrid.iso.sha256

      - name: Update Release Checksums
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG_INPUT:-${GITHUB_RELEASE_TAG:-$GITHUB_REF_NAME}}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "Error: Invalid release tag format: '$TAG'"
            exit 1
          fi
          if gh release download "$TAG" -p "SHA256SUMS.txt" --clobber 2>/dev/null; then
            grep -v "s0-live-amd64.hybrid.iso" SHA256SUMS.txt > SHA256SUMS.tmp || true
            cat s0-live-amd64.hybrid.iso.sha256 >> SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS.txt
          else
            cat s0-live-amd64.hybrid.iso.sha256 > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Attach ISO to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            s0-live-amd64.hybrid.iso
            s0-live-amd64.hybrid.iso.sha256
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
