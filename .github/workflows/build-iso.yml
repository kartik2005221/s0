name: Build Bootable Live ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach ISO to (e.g. v2.5.0)'
        required: true

concurrency:
  group: build-iso-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Bare-Metal Live ISO
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Release Tag & ISO Name
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG_INPUT:-${GITHUB_RELEASE_TAG:-$GITHUB_REF_NAME}}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "Error: Invalid release tag format: '$TAG'"
            exit 1
          fi
          ISO_NAME="s0-live-${TAG}-amd64.hybrid.iso"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO_NAME" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TAG"
          echo "ISO name:   $ISO_NAME"

      - name: Check If ISO Already Attached to Release
        id: check_iso
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ISO: ${{ steps.meta.outputs.iso_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if release '$TAG' already contains '$ISO'..."
          if gh release view "$TAG" --json assets -q ".assets[].name" 2>/dev/null | grep -Fxq "$ISO"; then
            echo "Notice: Live ISO '$ISO' already exists on release '$TAG'. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Live ISO '$ISO' not found on release '$TAG'. Proceeding with build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository at Tag
        if: steps.check_iso.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Install Debian Live-Build Toolchain
        if: steps.check_iso.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            curl
          curl -sLO https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          echo "a863905724e7b69d45066ebab113cb6de12a11984349847ad49f6151c10f017d  live-build_20230502_all.deb" | sha256sum -c -
          sudo dpkg -i live-build_20230502_all.deb || sudo apt-get install -fy

      - name: Build s0 Live ISO
        if: steps.check_iso.outputs.skip != 'true'
        run: |
          chmod +x linux/iso/build.sh linux/iso/auto/build.sh
          cd linux/iso
          sudo ./auto/build.sh
          ISO_TARGET="$GITHUB_WORKSPACE/${{ steps.meta.outputs.iso_name }}"
          sudo cp live-image-amd64.hybrid.iso "$ISO_TARGET"
          sudo chown runner:runner "$ISO_TARGET"

      - name: Prepare Artifacts & Checksums
        if: steps.check_iso.outputs.skip != 'true'
        run: |
          ISO="${{ steps.meta.outputs.iso_name }}"
          test -f "$ISO" || { echo "Error: $ISO not found"; exit 1; }
          sha256sum "$ISO" > "${ISO}.sha256"
          cat "${ISO}.sha256"

      - name: Update Release Checksums
        if: steps.check_iso.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ISO: ${{ steps.meta.outputs.iso_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch existing SHA256SUMS.txt from the release to preserve existing tarball hashes
          if gh release download "$TAG" -p "SHA256SUMS.txt" --clobber 2>/dev/null && [ -s SHA256SUMS.txt ]; then
            echo "Existing SHA256SUMS.txt found; preserving existing entries:"
            cat SHA256SUMS.txt
            grep -v -F "$ISO" SHA256SUMS.txt > SHA256SUMS.tmp || true
            cat "${ISO}.sha256" >> SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS.txt
          else
            echo "SHA256SUMS.txt not found on release; attempting to download tarball to preserve checksum..."
            if gh release download "$TAG" -p "s0-${TAG}.tar.gz" --clobber 2>/dev/null && [ -s "s0-${TAG}.tar.gz" ]; then
              sha256sum "s0-${TAG}.tar.gz" > SHA256SUMS.txt
              cat "${ISO}.sha256" >> SHA256SUMS.txt
            else
              cat "${ISO}.sha256" > SHA256SUMS.txt
            fi
          fi
          echo "Final merged SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Attach ISO to Release
        if: steps.check_iso.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.meta.outputs.iso_name }}
            ${{ steps.meta.outputs.iso_name }}.sha256
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
