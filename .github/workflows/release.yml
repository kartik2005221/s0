name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify Tests Before Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e core/python
          pip install -e linux/cli
          pip install reportlab qrcode pillow fastapi uvicorn httpx pytest pytest-asyncio

      - name: Run Pytest Suite
        run: |
          pytest --tb=short -q

  publish:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          python3 - <<'EOF'
          import os, re
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "")
          ver = tag.lstrip("v")
          changelog_path = Path("docs/project/changelog.md")
          notes = ""
          if changelog_path.is_file():
              content = changelog_path.read_text(encoding="utf-8")
              escaped_ver = re.escape(ver)
              pattern = rf"##\s*\[{escaped_ver}\][^\n]*\n(.*?)(?=\n---\n|\n##\s*\[|\Z)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()

          if not notes:
              notes = f"Release {tag} of s0 (Sector Zero) forensic data sanitization suite."

          Path("RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          EOF
          cat RELEASE_NOTES.md

      - name: Package Source Tarball & Checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "Error: Invalid or empty release tag: '$TAG'"
            exit 1
          fi
          ARCHIVE_NAME="s0-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="s0-${TAG}/" HEAD -o "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "s0 ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            s0-*.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Live ISO Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Dispatching build-iso.yml for tag ${TAG}..."
          gh workflow run build-iso.yml -f release_tag="${TAG}"
