name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify Tests Before Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The declared extras, not a hand-written package list. This file had the
          # same list ci.yml had, including a package that does not exist on PyPI --
          # in ci.yml it was `httx`, which aborted the whole install line so the test
          # job could not run at all while releases were tested. Two hand-written
          # lists are two lists that drift, and a typo in either is a build that
          # fails in a way that points nowhere near the cause.
          pip install -e ".[web,test]"

      - name: Run Pytest Suite
        run: |
          pytest --tb=short -q

  publish:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Runs before anything is built, hashed, uploaded or signed, because after the upload
      # it cannot be corrected in place.
      #
      # This workflow already refused to publish when the changelog had no section for the
      # tag. It did not check the tag against the code, so `git tag v3.0.0 && git push
      # --tags` with pyproject still at 2.4.4 would publish a wheel calling itself 2.4.4
      # under the name 3.0.0.
      - name: The tag matches the version the code declares
        run: python tools/check_release_version.py "$GITHUB_REF_NAME" --root .

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          # Fails loudly when the section for the tag being released is missing.
          #
          # This used to fall back to "Release <tag> of s0 (Sector Zero) forensic data
          # sanitization suite." That fallback is worse than no release notes: it looks
          # like a successful extraction, so a v3 tag cut from a changelog that had
          # stopped at 2.4.4 published generic text and nobody noticed until the
          # release page was public. It also read only docs/project/changelog.md, which
          # is a mirror -- the canonical file is /CHANGELOG.md at the repository root,
          # so notes were being taken from the copy rather than the source.
          #
          # A missing section is a release-preparation bug. Stopping here is correct:
          # the tag can be re-cut once the changelog has the entry.
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "")
          ver = tag.lstrip("v")
          if not ver:
              sys.exit(f"error: GITHUB_REF_NAME is empty; cannot pick a changelog section")

          candidates = [Path("CHANGELOG.md"), Path("docs/project/changelog.md")]
          changelog_path = next((p for p in candidates if p.is_file()), None)
          if changelog_path is None:
              sys.exit(f"error: no changelog found at any of {candidates}")

          content = changelog_path.read_text(encoding="utf-8")
          escaped_ver = re.escape(ver)
          pattern = rf"##\s*\[{escaped_ver}\][^\n]*\n(.*?)(?=\n---\n|\n##\s*\[|\Z)"
          m = re.search(pattern, content, re.DOTALL)
          if not m:
              have = re.findall(r"^##\s*\[([^\]]+)\]", content, re.MULTILINE)
              sys.exit(
                  f"error: {changelog_path} has no section for {tag} (looked for "
                  f"'## [{ver}]').\n"
                  f"       Sections present: {have}\n"
                  f"       Add the entry to the canonical changelog "
                  f"(CHANGELOG.md at the repository root), run "
                  f"`python tools/sync_changelog.py --write`, commit, and re-cut the tag."
              )

          notes = m.group(1).strip()
          if not notes:
              sys.exit(f"error: the '{ver}' section in {changelog_path} is empty")

          Path("RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          print(f"extracted {len(notes)} characters of notes for {tag} from {changelog_path}")
          PY
          cat RELEASE_NOTES.md

      - name: Package Source Tarball & Checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "Error: Invalid or empty release tag: '$TAG'"
            exit 1
          fi
          ARCHIVE_NAME="s0-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="s0-${TAG}/" HEAD -o "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: "s0 ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            s0-*.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Live ISO Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Dispatching build-iso.yml for tag ${TAG}..."
          gh workflow run build-iso.yml -f release_tag="${TAG}"
