# Dependency updates.
#
# Grouped so that a week of routine bumps is one reviewable pull request rather
# than thirty. Security updates are kept separate and ungrouped: those are
# reviewed on their own merits and should not wait behind a formatting bump.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
