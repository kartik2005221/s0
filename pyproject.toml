[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s0"
version = "3.1.0"
description = "S0 (Sector Zero) — unified forensic sanitization, acquisition and file-recovery suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sector Zero" }]
keywords = [
    "digital-forensics",
    "file-carving",
    "media-sanitization",
    "chain-of-custody",
    "nist-800-88",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "cryptography>=42.0.0",
    "reportlab>=4.0.0",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.28.0", "starlette>=0.36.0"]
test = ["pytest>=8.0.0", "httpx>=0.27.0", "pytest-cov>=5.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pyyaml>=6.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/kartik2005221/s0"
Documentation = "https://sector0.gitbook.io/"
"Certificate Verification" = "https://sector0.pages.dev/verify/"
"Installation Guide" = "https://sector0.pages.dev/install/"

[project.scripts]
# The operator-facing entry point.
s0 = "s0.cli.main:main"
# Certificate-authority helpers, kept as separate commands because an issuing
# authority runs them out-of-band on its own machine, never on an evidence host.
s0-keygen = "s0.certcli:keygen_main"
s0-sign = "s0.certcli:sign_main"
s0-verify = "s0.certcli:verify_main"
s0-cert-pdf = "s0.certcli:pdf_main"

[tool.setuptools]
# One distribution, one importable package. There is deliberately no second
# distribution and no directory named after a platform.
include-package-data = true

[tool.setuptools.packages.find]
# `src` for the library, `.` for the agent skill directory that sits beside it.
# `namespaces = true` is what lets `skills/` and `skills/s0-forensics` be found
# without an `__init__.py` in either -- the skill is a document tree an agent
# reads, not an importable package, and adding `__init__.py` to make the packager
# happy would misdescribe it. `include` is the filter that keeps the repository's
# other top-level directories (`docs`, `tests`, `tools`, `site`, `iso`, ...) out
# of the distribution.
where = ["src", "."]
include = ["s0*", "skills*"]
namespaces = true

[tool.setuptools.package-data]
# Resolved at runtime through s0.resources / the module's own directory, never
# through filesystem arithmetic from an assumed install prefix.
"s0.data" = ["*.json", "*.pem", "keys/*.pem"]
"s0.web" = [
    "static/*.html",
    "static/*.ico",
    "static/*.png",
    "static/*.webmanifest",
    "static/css/*",
    "static/fonts/*",
    "static/js/*",
    "static/assets/**/*",
]
# The agent skill ships with the distribution, not only with the git clone. An
# installed package user (wheel or git) and a curl-one-liner user both need SKILL.md, its
# references, its eval prompts and the standalone certificate verifier, and
# without this a wheel carries `s0` alone and the skill simply does not exist for
# them. `skills/` is found as a top-level namespace package (`where = ["src",
# "."]` above), so its files need naming here: `*.md` and `evals/*.json` are
# plain data, and `scripts/*.py` is data too even though build_py has already
# claimed it as a module.
"skills.s0-forensics" = ["*.md", "evals/*.json", "references/*.md", "scripts/*.py"]

[tool.pytest.ini_options]
# CI runs a bare `pytest`, so this list is the contract for what gets tested.
# It must name every suite that exists in the tree; a missing entry silently
# reduces coverage rather than failing.
testpaths = [
    "tests/core",
    "tests/cli",
    "tests/web",
    "tests/portal",
    "tests/carve",
    "tests/platform_windows",
    "tests/platform_macos",
    # Was missing, so a bare `pytest` collected none of its 22 tests. They only
    # ran when named explicitly, which means CI was not running them either --
    # CI invokes `pytest tests/...` per directory in some jobs and bare `pytest`
    # in others, so a suite that only runs when someone remembers to ask for it
    # is a suite that silently stops running.
    "tests/iso",
]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # Builds a wheel or a filesystem image: slow, and skipped when the build
    # backend cannot run. Asserted on the artefact rather than the config,
    # because the config being right is not the same as the wheel containing it.
    "slow: builds an artefact (wheel, image) to assert on the result",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "S"]
ignore = [
    "S101",  # assert is used deliberately in tests and internal invariants
    "E501",  # long lines are caught by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, shell out to ffmpeg and the CLI, build MD5/SHA-1 lists on
# purpose, and shuffle fixtures with a seeded PRNG: those are the things under
# test, not oversights.
# `S108` appears because several tests assert that s0 *refuses* `/tmp/...`
# inputs; the hardcoded path is the subject of the assertion. `E101` fires on
# `test_firmware_probes.py`, whose fixtures reproduce hdparm output verbatim --
# real hdparm indents with tabs, and normalising them would make the parser
# tests stop testing the parser.
# `E402` is needed by the platform-launcher tests: they put the repo root on
# `sys.path` first, then import `macos/` and `windows/`, which are standalone
# launchers rather than parts of the installed `s0` distribution.
# `S110` is unlinking a `tmp_path` file during cleanup.
"tests/**" = [
    "S101", "S311", "S324", "S603", "S607", "S108",
    "E101", "E402", "S110",
]

# Best-effort cleanup is the idiom, not an oversight. `try: os.unlink(x)
# except OSError: pass` means "the file was already gone, which is the outcome we
# wanted". Rewriting 124 of these to log would bury real errors in noise, and the
# ones that must not be silent (certificate signing, device selection) already
# raise or append to `warnings`.
#
# `main.py` and `__init__.py` import inside functions on purpose: the CLI defers
# heavy imports until the subcommand needs them, so `s0 --help` does not pay for
# reportlab, and `s0/__init__.py` does not create an import cycle.
#
# The tool's entire job includes shelling out to ffmpeg, hdparm, nvme and
# sg_sanitize, which is why S603 and S607 are ignored in `src` too. The security
# review that matters is bandit, which is a gate in CI.
"src/**/*.py" = ["S110", "E402", "S603", "S607"]
"src/s0/cli/main.py" = ["S110", "E402", "S603", "S607"]
"src/s0/__init__.py" = ["S110", "E402", "S603", "S607"]
"src/s0/web/app.py" = ["S310"]
"src/s0/live/live_manager.py" = ["S310", "S112"]
"src/s0/temperature.py" = ["S112"]

# The platform erasers, the release script, the benchmark harness and the skill's
# certificate checker are all developer-invoked programs that legitimately call
# tools found on PATH: `diskutil` and `mdls` on macOS, `manage-bde`/`cipher` and
# PowerShell on Windows, `git`/`gh` in the release script, `ffmpeg` in the
# benchmark. Hard-coding absolute paths would break them on any machine where
# those tools are installed somewhere else.
#
# S603/S607 are therefore recorded as accepted risk here rather than "fixed".
# The control that actually matters is that no untrusted input reaches these argv
# lists: `S310`-style URL fetches are pinned to https, and Bandit runs as a
# blocking gate in CI with zero medium-or-higher findings.
"macos/cli/*.py" = ["S110", "S603", "S607", "E402"]
"windows/cli/*.py" = ["S110", "S603", "S607", "E402"]
"tools/*.py" = ["S110", "S603", "S607", "E402"]
"skills/s0-forensics/scripts/*.py" = ["S110", "S603", "S607", "E402"]

[tool.bandit]
exclude_dirs = ["tests", "vendor", "docs"]
