[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s0-core"
version = "2.2.0"
description = "s0 shared core: canonical JSON, Ed25519 signing, wipe certificates, PDF generation"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41",
    "reportlab>=4",
    "qrcode>=7",
    "Pillow>=9",
]

[project.scripts]
s0-keygen = "s0_core.cli:keygen_main"
s0-sign = "s0_core.cli:sign_main"
s0-verify = "s0_core.cli:verify_main"
s0-cert-pdf = "s0_core.cli:pdf_main"

[tool.setuptools.packages.find]
include = ["s0_core*"]
