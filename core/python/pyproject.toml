[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustwipe-core"
version = "0.1.0"
description = "TrustWipe shared core: canonical JSON, Ed25519 signing, wipe certificates, PDF generation"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41",
    "reportlab>=4",
    "qrcode>=7",
    "Pillow>=9",
]

[project.scripts]
trustwipe-keygen = "trustwipe_core.cli:keygen_main"
trustwipe-sign = "trustwipe_core.cli:sign_main"
trustwipe-verify = "trustwipe_core.cli:verify_main"
trustwipe-cert-pdf = "trustwipe_core.cli:pdf_main"

[tool.setuptools.packages.find]
include = ["trustwipe_core*"]
